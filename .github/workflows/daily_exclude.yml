name: Daily Exclude Screener (11 gates → Sheets)

on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ).
    # Staggered after Daily 06:30, CDEF ~07:05, and Zhuli 08:33 JST
    # (~35 min full-universe Yahoo job). Finish is after the old 09:00 HKT
    # target; morning + late backups still cover a missed primary.
    # During EST (UTC-5) 09:13 JST is 19:13 ET (close+3h13).
    - cron: "13 0 * * 2-6"
    # Mid backups: 12:58 / 13:34 JST Tue–Sat (offset from Zhuli/Strong mids).
    - cron: "58 3 * * 2-6"
    - cron: "34 4 * * 2-6"
    # Late backup 17:42 JST Tue–Sat (staggered 15:00 Yahoo ladder).
    - cron: "42 8 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-exclude-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow daily_exclude.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run 11-gate exclude screener
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python run_exclude.py --out-dir out
      - name: Upload gate artifacts
        if: steps.already.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exclude_gates
          path: |
            out/
          retention-days: 14
