name: Daily Exclude Screener (11 gates → Sheets)

on:
  schedule:
# Primary trigger is the 07:30 JST routine (workflow_dispatch), approved
# 2026-11-17 (Philip / 指原). GitHub schedule is a midday backup only:
# odd minutes, Tue–Sat, staggered so writers do not share a Yahoo pull.
# Skip-if-session-already-succeeded makes this a no-op after a successful
# morning run. Morning crons added 2026-11-26 (Philip decoupling decision):
# an independent trigger layer only — GitHub schedule has no SLA, so the
# routine dispatch remains the punctuality guarantee.
    # Morning trigger: 08:31 JST Tue–Sat = `31 23 * * 1-5` UTC.
    - cron: "31 23 * * 1-5"
    # Midday backup: 13:41 JST Tue–Sat = `41 4 * * 2-6` UTC.
    - cron: "41 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-exclude-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow daily_exclude.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run 11-gate exclude screener
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python run_exclude.py --out-dir out
      - name: Upload gate artifacts
        if: steps.already.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exclude_gates
          path: |
            out/
          retention-days: 14
