name: Daily Exclude Screener (10 gates → Sheets)

on:
  schedule:
    # 01:00 UTC Tue–Sat ≈ after US cash close Mon–Fri (same as fundflow tips)
    - cron: "0 1 * * 2-6"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run 10-gate exclude screener
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python run_exclude.py --out-dir out
      - name: Upload gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exclude_gates
          path: |
            out/
          retention-days: 14
