name: Daily Exclude Screener (11 gates → Sheets)

on:
  schedule:
    # After US cash close Mon–Fri, when Yahoo daily bars are usually settled.
    # 06:00 UTC Tue–Sat =
    #   ET: 02:00 EDT / 01:00 EST (~9–10h after 16:00 ET close; before next 09:30 ET open)
    #   HKT: 14:00 Tue–Sat
    # Earlier 01:00 UTC (~21:00/20:00 ET) is also after close but Yahoo is often still catching up.
    - cron: "0 6 * * 2-6"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run 11-gate exclude screener
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python run_exclude.py --out-dir out
      - name: Upload gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exclude_gates
          path: |
            out/
          retention-days: 14
