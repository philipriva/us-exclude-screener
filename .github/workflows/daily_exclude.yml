name: Daily Exclude Screener (11 gates → Sheets)

on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ).
    # Intent: US cash equity close + 2 hours, Mon–Fri; finish before 09:00 Asia/Hong_Kong.
    # Same pattern as ExtraScan QQscan:
    #   0 22 * * 1-5 ≈ 18:00 America/New_York during EDT (UTC-4) = close+2h
    #   → ~06:00 HKT next calendar morning; job ~24–40min ⇒ well before 09:00 HKT.
    # During EST (UTC-5) the same UTC cron is 17:00 ET = close+1h (GitHub UTC limitation;
    # still after close, still before 09:00 HKT). Optional EST shift: 0 23 * * 1-5.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run 11-gate exclude screener
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python run_exclude.py --out-dir out
      - name: Upload gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exclude_gates
          path: |
            out/
          retention-days: 14
