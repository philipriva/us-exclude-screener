name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests (no Sheets / no production download)
        env:
          # Ensure sheet writer cannot fire even if a test mishandles flags
          GOOGLE_SERVICE_ACCOUNT_JSON: ""
        run: python -m pytest -q tests/
